receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter: {check_interval: 1s, limit_mib: 256}
  batch: {timeout: 2s}
  resource:
    attributes:
      - {key: deployment.environment, value: local, action: upsert}
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
service:
  telemetry:
    logs: {level: info}
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo]
