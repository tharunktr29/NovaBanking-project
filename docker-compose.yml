name: novabank

services:
  postgres:
    image: postgres:16-alpine
    container_name: novabank-postgres
    environment:
      POSTGRES_USER: novabank
      POSTGRES_PASSWORD: novabank_dev_password
      POSTGRES_DB: novabank_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novabank -d novabank_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: novabank-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.1
    container_name: novabank-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: apache/kafka:3.7.1
    container_name: novabank-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]

  postgres-db-init:
    profiles: ["app"]
    image: postgres:16-alpine
    container_name: novabank-postgres-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: novabank_dev_password
    command: ["sh", "-c", "for db in novabank_transaction novabank_card novabank_payment novabank_engagement; do psql -h postgres -U novabank -d novabank_admin -tc \"SELECT 1 FROM pg_database WHERE datname = '$$db'\" | grep -q 1 || psql -h postgres -U novabank -d novabank_admin -c \"CREATE DATABASE $$db\"; done"]

  auth-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: novabank-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/novabank_auth
      AUTH_DB_USERNAME: novabank
      AUTH_DB_PASSWORD: novabank_dev_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: dev-only-change-this-secret-key-32-bytes-minimum
    ports:
      - "8081:8081"

  api-gateway:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: novabank-api-gateway
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      customer-service:
        condition: service_started
      account-service:
        condition: service_started
      transaction-service:
        condition: service_started
      card-service:
        condition: service_started
      payment-service:
        condition: service_started
      engagement-service:
        condition: service_started
    environment:
      AUTH_SERVICE_URI: http://auth-service:8081
      CUSTOMER_SERVICE_URI: http://customer-service:8082
      ACCOUNT_SERVICE_URI: http://account-service:8083
      TRANSACTION_SERVICE_URI: http://transaction-service:8084
      CARD_SERVICE_URI: http://card-service:8085
      PAYMENT_SERVICE_URI: http://payment-service:8086
      ENGAGEMENT_SERVICE_URI: http://engagement-service:8087
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-only-change-this-secret-key-32-bytes-minimum
    ports:
      - "8080:8080"

  customer-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile
    container_name: novabank-customer-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      CUSTOMER_DB_URL: jdbc:postgresql://postgres:5432/novabank_customer
      CUSTOMER_DB_USERNAME: novabank
      CUSTOMER_DB_PASSWORD: novabank_dev_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: dev-only-change-this-secret-key-32-bytes-minimum
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 10s
      timeout: 5s
      retries: 10

  account-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/account-service/Dockerfile
    container_name: novabank-account-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ACCOUNT_DB_URL: jdbc:postgresql://postgres:5432/novabank_account
      ACCOUNT_DB_USERNAME: novabank
      ACCOUNT_DB_PASSWORD: novabank_dev_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: dev-only-change-this-secret-key-32-bytes-minimum
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 10s
      timeout: 5s
      retries: 10

  transaction-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/transaction-service/Dockerfile
    container_name: novabank-transaction-service
    depends_on:
      postgres-db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      TRANSACTION_DB_URL: jdbc:postgresql://postgres:5432/novabank_transaction
      TRANSACTION_DB_USERNAME: novabank
      TRANSACTION_DB_PASSWORD: novabank_dev_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: dev-only-change-this-secret-key-32-bytes-minimum
      NOVABANK_DEV_TOOLS_ENABLED: "false"
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  card-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/card-service/Dockerfile
    container_name: novabank-card-service
    depends_on:
      postgres-db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      account-service:
        condition: service_started
    environment:
      CARD_DB_URL: jdbc:postgresql://postgres:5432/novabank_card
      CARD_DB_USERNAME: novabank
      CARD_DB_PASSWORD: novabank_dev_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: dev-only-change-this-secret-key-32-bytes-minimum
      ACCOUNT_SERVICE_URI: http://account-service:8083
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  payment-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: novabank-payment-service
    depends_on:
      postgres-db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      account-service:
        condition: service_started
      card-service:
        condition: service_started
      transaction-service:
        condition: service_started
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/novabank_payment
      PAYMENT_DB_USERNAME: novabank
      PAYMENT_DB_PASSWORD: novabank_dev_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: dev-only-change-this-secret-key-32-bytes-minimum
      ACCOUNT_SERVICE_URI: http://account-service:8083
      CARD_SERVICE_URI: http://card-service:8085
      TRANSACTION_SERVICE_URI: http://transaction-service:8084
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    profiles: ["app"]
    build:
      context: apps/web
    container_name: novabank-web
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "5173:80"

  engagement-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/engagement-service/Dockerfile
    container_name: novabank-engagement-service
    depends_on:
      postgres-db-init:
        condition: service_completed_successfully
      account-service:
        condition: service_started
    environment:
      ENGAGEMENT_DB_URL: jdbc:postgresql://postgres:5432/novabank_engagement
      ENGAGEMENT_DB_USERNAME: novabank
      ENGAGEMENT_DB_PASSWORD: novabank_dev_password
      JWT_SECRET: dev-only-change-this-secret-key-32-bytes-minimum
      DOCUMENT_ENCRYPTION_KEY: dev-only-document-key-change-me
      ACCOUNT_SERVICE_URI: http://account-service:8083
    ports:
      - "8087:8087"

volumes:
  postgres-data:
