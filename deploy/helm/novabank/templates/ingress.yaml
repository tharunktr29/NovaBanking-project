{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novabank-public
  annotations: {nginx.ingress.kubernetes.io/ssl-redirect: "true"}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: [{hosts: [{{ .Values.ingress.host | quote }}], secretName: {{ .Values.ingress.tlsSecretName }} }]
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - {path: /api, pathType: Prefix, backend: {service: {name: api-gateway, port: {number: 8080}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 8080}}}}
{{- end }}
