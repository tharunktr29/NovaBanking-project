{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: novabank}
spec:
  replicas: {{ $svc.replicas | default 2 }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: {{ $name }}}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: novabank}
      annotations: {checksum/config: {{ printf "%s-%s" $.Values.global.environment $.Values.global.otlpEndpoint | sha256sum | quote }}}
    spec:
      serviceAccountName: novabank
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: {{ $name }}}}}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.imageRegistry }}{{ $svc.image }}:{{ $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports: [{name: http, containerPort: {{ $svc.port }}}]
          envFrom:
            - {configMapRef: {name: novabank-runtime}}
            - {secretRef: {name: {{ $.Values.global.secretName }}}}
          resources: {{ toYaml $.Values.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if eq $name "web" }}
            - {name: nginx-run, mountPath: /run}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            {{- end }}
          startupProbe: {httpGet: {path: {{ if eq $name "web" }}/{{ else }}/actuator/health/liveness{{ end }}, port: http}, failureThreshold: 30, periodSeconds: 10}
          livenessProbe: {httpGet: {path: {{ if eq $name "web" }}/{{ else }}/actuator/health/liveness{{ end }}, port: http}, periodSeconds: 20, timeoutSeconds: 3}
          readinessProbe: {httpGet: {path: {{ if eq $name "web" }}/{{ else }}/actuator/health/readiness{{ end }}, port: http}, periodSeconds: 10, timeoutSeconds: 3}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
        {{- if eq $name "web" }}
        - {name: nginx-run, emptyDir: {sizeLimit: 16Mi}}
        - {name: nginx-cache, emptyDir: {sizeLimit: 64Mi}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ $name }}, labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: novabank}}
spec: {type: ClusterIP, selector: {app.kubernetes.io/name: {{ $name }}}, ports: [{name: http, port: {{ $svc.port }}, targetPort: http}]}
{{- if $.Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: {{ $name }}}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $name }}}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }}}}}]
{{- end }}
{{- if $.Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: {{ $name }}}
spec: {minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}, selector: {matchLabels: {app.kubernetes.io/name: {{ $name }}}}}
{{- end }}
{{- end }}
