# Example only. Supply managed RDS/MSK/ElastiCache endpoints and External Secrets at deployment time.
global:
  environment: production
  imageRegistry: 000000000000.dkr.ecr.us-east-1.amazonaws.com/
  secretName: novabank-production-runtime
