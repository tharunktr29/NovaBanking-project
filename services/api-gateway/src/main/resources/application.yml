server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@customerOrIpKeyResolver}"
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            redis-rate-limiter.requestedTokens: 1
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/customers/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
        - id: account-service
          uri: ${ACCOUNT_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/accounts/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
        - id: transaction-service
          uri: ${TRANSACTION_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/transactions/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
        - id: card-service
          uri: ${CARD_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/cards/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
        - id: payment-service-payments
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/payments/**
        - id: payment-service-transfers
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/transfers/**
        - id: payment-service-payees
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/payees/**
        - id: engagement-service
          uri: ${ENGAGEMENT_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/statements/**,/api/disputes/**,/api/notifications/**,/api/notification-preferences/**
        - id: risk-service
          uri: ${RISK_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/api/risk/**

novabank:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-key-32-bytes-minimum}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 30s
management.endpoint.health.probes.enabled: true
management.endpoint.health.show-details: never
management.metrics.tags.service: ${spring.application.name}
management.metrics.tags.environment: ${NOVABANK_ENVIRONMENT:local}
management.tracing.sampling.probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.tracing.timeout: 5s
spring.kafka.listener.observation-enabled: true
spring.kafka.template.observation-enabled: true
