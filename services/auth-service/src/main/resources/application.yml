server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/novabank_auth}
    username: ${AUTH_DB_USERNAME:novabank}
    password: ${AUTH_DB_PASSWORD:novabank_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

novabank:
  jwt:
    issuer: ${JWT_ISSUER:novabank-auth-service}
    secret: ${JWT_SECRET:dev-only-change-this-secret-key-32-bytes-minimum}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 30s
management.endpoint.health.probes.enabled: true
management.endpoint.health.show-details: never
management.metrics.tags.service: ${spring.application.name}
management.metrics.tags.environment: ${NOVABANK_ENVIRONMENT:local}
management.tracing.sampling.probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.tracing.timeout: 5s
spring.kafka.listener.observation-enabled: true
spring.kafka.template.observation-enabled: true
