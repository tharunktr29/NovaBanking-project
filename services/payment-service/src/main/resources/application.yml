server:
  port: 8086
spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/novabank_payment}
    username: ${PAYMENT_DB_USERNAME:novabank}
    password: ${PAYMENT_DB_PASSWORD:novabank_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
novabank:
  jwt:
    issuer: ${JWT_ISSUER:novabank-auth-service}
    secret: ${JWT_SECRET:dev-only-change-this-secret-key-32-bytes-minimum}
  payments:
    account-service-uri: ${ACCOUNT_SERVICE_URI:http://localhost:8083}
    card-service-uri: ${CARD_SERVICE_URI:http://localhost:8085}
    transaction-service-uri: ${TRANSACTION_SERVICE_URI:http://localhost:8084}
    risk-service-uri: ${RISK_SERVICE_URI:http://localhost:8088}
    internal-timeout-ms: ${PAYMENT_INTERNAL_TIMEOUT_MS:3000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 30s
management.endpoint.health.probes.enabled: true
management.endpoint.health.show-details: never
management.metrics.tags.service: ${spring.application.name}
management.metrics.tags.environment: ${NOVABANK_ENVIRONMENT:local}
management.tracing.sampling.probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.tracing.timeout: 5s
spring.kafka.listener.observation-enabled: true
spring.kafka.template.observation-enabled: true
resilience4j:
  circuitbreaker:
    configs:
      default: {sliding-window-size: 20, minimum-number-of-calls: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 10s, register-health-indicator: true}
    instances:
      accountService: {base-config: default}
      cardService: {base-config: default}
      transactionService: {base-config: default}
  bulkhead:
    configs:
      default: {max-concurrent-calls: 20, max-wait-duration: 0}
